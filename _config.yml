url: "https://hemachander65.github.io"
baseurl: ""

remote_theme: abhinavs/moonwalk@68c4de4

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-soopr-seo-tag
  - jekyll-markdown-output
  - jekyll-llms-output
  - kramdown-parser-gfm

theme_config:
  appearance: "dark"
  appearance_toggle: true
  back_home_text: "home.."
  date_format: "%Y-%m-%d"
  show_description: true
  show_navbar: true
  show_footer: true
  show_copyright: true
  show_projects: true
  show_blog: true
  show_old_projects: false
  show_misc_list: false
  show_reading_time: true
  show_tags: true
  home:
    title_projects: Portfolio
    title_misc_list: Details
    title_blog: Blog
    title_old_projects: Old Projects

defaults:
  - scope:
      path: "images"
    values:
      image: true

soopr:
  publish_token: ""

highlighter: rouge

sass:
  style: :compressed